name: CI
# Every action is pinned to a commit, with its version in the comment beside it, so a tag moved
# upstream cannot change what runs here. Dependabot proposes new pins (.github/dependabot.yml).
# Nothing here pushes to the repository, so checkout does not leave its token on disk.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Install scripts are off. No package in the lockfile has one today, so nothing is lost, and a
      # dependency that grows one later cannot run it here.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Server starts and lists tools
        run: |
          node -e '
          const { spawn } = require("child_process");
          const p = spawn("node", ["dist/index.js"], { env: { ...process.env, OVERWING_API_KEY: "ow_live_test" } });
          let out = "";
          p.stdout.on("data", (d) => (out += d));
          p.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 1, method: "initialize", params: { protocolVersion: "2025-06-18", capabilities: {}, clientInfo: { name: "ci", version: "0" } } }) + "\n");
          setTimeout(() => {
            p.stdin.write(JSON.stringify({ jsonrpc: "2.0", method: "notifications/initialized" }) + "\n");
            p.stdin.write(JSON.stringify({ jsonrpc: "2.0", id: 2, method: "tools/list" }) + "\n");
          }, 300);
          setTimeout(() => {
            p.kill();
            const ok = out.includes("\"evaluate\"") && out.includes("\"evaluate_batch\"");
            console.log(ok ? "tools listed" : out);
            process.exit(ok ? 0 : 1);
          }, 1500);'
